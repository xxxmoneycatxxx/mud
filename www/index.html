<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB MUD CLIENT - FluffOS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
        <div class="stats-line" id="statsLine">
            <span style="color:#666;">气血 --/--</span>
        </div>
    </div>

    <div class="terminal" id="terminal">正在连接到 MUD……</div>

    <!-- 小地图浮动面板：房间信息 + Canvas 地图 -->
    <div class="minimap-panel" id="minimapPanel">
        <div class="minimap-header">
            <span class="minimap-title" id="minimapTitle">房间: --</span>
            <span class="minimap-floor" id="minimapFloorInd" style="display:none">F0</span>
            <button class="minimap-toggle" id="minimapToggle" title="收起/展开小地图">−</button>
        </div>
        <div class="minimap-body" id="minimapBody">
            <canvas class="minimap-content" id="minimapContent" width="280" height="220"></canvas>
            <!-- 九宫格移动面板：8 方向 + 扩展栏 -->
            <div class="move-panel" id="movePanel">
                <div class="move-grid">
                    <div class="move-cell" data-dir="northwest"><span class="move-dir">↖</span><span class="move-name">西北</span></div>
                    <div class="move-cell" data-dir="north"><span class="move-dir">↑</span><span class="move-name">北</span></div>
                    <div class="move-cell" data-dir="northeast"><span class="move-dir">↗</span><span class="move-name">东北</span></div>
                    <div class="move-cell" data-dir="west"><span class="move-dir">←</span><span class="move-name">西</span></div>
                    <div class="move-cell move-center" id="moveCenter"><span class="move-dir">●</span></div>
                    <div class="move-cell" data-dir="east"><span class="move-dir">→</span><span class="move-name">东</span></div>
                    <div class="move-cell" data-dir="southwest"><span class="move-dir">↙</span><span class="move-name">西南</span></div>
                    <div class="move-cell" data-dir="south"><span class="move-dir">↓</span><span class="move-name">南</span></div>
                    <div class="move-cell" data-dir="southeast"><span class="move-dir">↘</span><span class="move-name">东南</span></div>
                </div>
                <div class="move-extra" id="moveExtra"></div>
            </div>
            <div class="minimap-progress" id="minimapProgress"></div>
        </div>
    </div>

    <!-- 地图全屏覆盖层 -->
    <div class="map-fullscreen" id="mapFullscreen">
        <div class="map-fs-header">
            <span class="map-fs-title" id="mapFsTitle">地图</span>
            <button class="map-fs-close" id="mapFsClose" title="退出全屏 (Esc 或双击)">✕</button>
        </div>
        <canvas id="mapFsCanvas"></canvas>
    </div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" class="command-input" id="commandInput" placeholder="输入命令... (↑↓查看历史)" disabled>
            <div class="history-hint" id="historyHint" style="display: none;">↑↓历史</div>
        </div>
        <button class="send-btn" id="sendBtn" disabled>发送</button>
    </div>

    <!-- 底部条：帮助按钮 + 快捷命令 + 连接状态 -->
    <div class="bottom-bar">
        <button class="qc-btn help-btn" id="helpBtn" title="浏览帮助文档 (F1)">帮助</button>
        <div class="quick-commands" id="quickCommands"></div>
        <div class="status-container">
            <div class="status connecting" id="status">
                <span>正在连接...</span>
            </div>
        </div>
    </div>

    <!-- 帮助浏览模态框：复古 ASCII 风格，导航型（选中主题即在终端执行 help <主题>） -->
    <div class="help-overlay" id="helpOverlay">
        <div class="help-modal" id="helpModal" tabindex="-1">
            <div class="help-titlebar">【 江湖帮助 】</div>
            <div class="help-searchbar">
                <span class="help-prompt">&gt;</span>
                <input type="text" id="helpSearch" class="help-search" placeholder="搜索帮助文档内容…（按 / 聚焦）" autocomplete="off">
            </div>
            <div class="help-content">
                <div class="help-cats" id="helpCats"></div>
                <div class="help-topics" id="helpTopics"></div>
            </div>
            <div class="help-statusbar" id="helpFooter">↑↓ 选择 · Enter 查看 · / 搜索 · Esc 关闭</div>
        </div>
    </div>

    <!-- 设置面板：触发器管理等 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <div class="settings-titlebar">
                <span>【 设置 】</span>
                <button class="settings-close" id="settingsClose" title="关闭 (Esc)">✕</button>
            </div>
            <div class="settings-body">
                <div class="settings-section">
                    <div class="settings-section-title">自动触发器</div>
                    <div class="settings-triggers" id="settingsTriggers"></div>
                </div>
            </div>
            <div class="settings-footer">Esc 关闭</div>
        </div>
    </div>

    <!-- 脚本按依赖顺序加载：常量 → 地图 → 寻路 → 类定义 → 原型扩展 → 实例化 -->
    <script src="js/telnet.js"></script>
    <script src="js/ansi.js"></script>
    <script src="js/mapper.js"></script>
    <script src="js/pathfinder.js"></script>
    <script src="js/client.js"></script>
    <script src="js/client-ui.js"></script>
    <script src="js/help.js"></script>
    <script>
        // 所有原型扩展加载完毕后启动客户端
        const client = new AdvancedMUDClient();
    </script>
</body>
</html>
