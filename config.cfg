###############################################################################
#              FluffOS 统一运行配置 (跨平台: Linux / Windows / Docker)         #
###############################################################################
# 所有路径相对于 mudlib 目录，除 mudlib directory 外。                         #
# 以 # 开头的行为注释，空行被忽略。                                            #
###############################################################################

## ==== 必须配置 ====

# MUD 名称
name : 炎黄群侠传

# mudlib 绝对路径 (Docker 中设为 /mud，本地开发设为 .)
mudlib directory : .

# 日志目录
log directory : /log

# include 搜索路径 (#include <...>)
include directories : /include:/mudcore/include

# master 对象定义文件
master file : /adm/single/master

# simulated efun 定义文件
simulated efun file : /adm/single/simul_efun

# 全局 include 文件
global include file : <globals.h>

# debug.log 文件名
debug log file : debug.log

## ==== 端口配置 ====

# 支持协议: telnet / binary / ascii / MUD / websocket
external_port_1 : telnet 5566
external_port_2 : telnet 6666
# external_port_2_tls : cert=cert.crt key=cert.key
external_port_3 : websocket 8888
# external_port_3_tls : cert=cert.crt key=cert.key

# WebSocket HTTP 目录
websocket http dir : www

## ==== 推荐配置 ====

# 命令错误时的提示消息
default fail message : [35m命令错误，请输入 help 查看游戏帮助。[0m

# 运行时错误消息
default error message : [31m你发现事情不太对了，但是又说不上来。[0m

## ==== 外部命令 (按平台取消注释) ====

# --- Linux / Docker ---
external_cmd_1 : /usr/bin/curl
external_cmd_2 : /usr/bin/python3
external_cmd_3 : /usr/bin/bash

# --- Windows (取消下面的注释并注释上面的 Linux 部分) ---
# external_cmd_1 : C:\ProgramData\chocolatey\bin\curl.exe
# external_cmd_2 : C:\Windows\py.exe

## ==== 协议扩展 ====

enable gmcp : 1 # default: 0
enable mssp : 1
enable msp : 1

## ==== 运行时调优 ====

warn tab : 1 # default: 0
living hash table size : 2048 # default: 256
maximum array size : 30000 # default: 15000

###############################################################################
# 以上为常用配置。完整运行时配置选项请参考 FluffOS 文档。                       #
# 以下为不常用选项，取消注释即可启用。                                          #
###############################################################################

# ==== 内存与限制 ====
# evaluator stack size : 65536
# maximum call depth : 150
# maximum evaluation cost : 30000000
# maximum buffer size : 1048576
# maximum mapping size : 15000
# maximum string length : 1048576
# maximum read file size : 262144
# maximum byte transfer : 262144

# ==== 哈希表 ====
# hash table size : 65536
# object table size : 4096

# ==== 游戏时间 ====
# gametick msec : 1000
# heartbeat interval msec : 1000

# ==== 对象管理 ====
# time to clean up : 600
# time to reset : 900
# time to swap : 300
# lazy resets : 0
# randomized resets : 1

# ==== 兼容性与行为 ====
# no resets : 0
# no ansi : 1
# strip before process input : 1
# trace : 1
# trace code : 0
# mudlib error handler : 1
# has console : 1
# trap crashes : 1
# call other type check : 0
# old type behavior : 0
# old range behavior : 0
# warn old range behavior : 1
# suppress argument warnings : 1
# enable_commands call init : 1
# sprintf add_justified ignore ANSI colors : 1
# call_out(0) next level : 1000

# ==== Telnet 扩展 ====
# enable mxp : 0
# enable zmp : 0
# enable msdp : 0
